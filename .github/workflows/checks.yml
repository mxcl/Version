on:
  push:
    branches:
      - master
    paths:
      - Sources/**
      - Tests/**
      - Package.swift
      - Package@swift-*.swift
      - .github/workflows/checks.yml
permissions:
  contents: read

jobs:
  macOS:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v6
    - run: swift --version
    - run: swift test --parallel
