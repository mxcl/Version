name: CI

on:
  pull_request:
    paths:
      - Sources/**
      - Tests/**
      - Package.swift
      - Package@swift-*.swift
      - .github/workflows/ci.yml
  push:
    branches: master
    paths:
      - Sources/**
      - Tests/**
      - Package.swift
      - Package@swift-*.swift
      - .github/workflows/ci.yml
  schedule:
    - cron: '3 3 * * 4'  # 3:03 AM, every Thursday

concurrency:
  group: ${{ github.head_ref || 'scheduled' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macOS:
    runs-on: macos-latest
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@v6
    - uses: mxcl/xcodebuild@v3
      with:
        code-coverage: true
    - uses: codecov/codecov-action@v5
      with:
        use_oidc: true

  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        x:
        - swift: 4.2
          action: build
        - swift: 5.10
          action: build
        - swift: latest
          action: test
    container:
      image: swift:${{ matrix.x.swift }}
    steps:
    - uses: actions/checkout@v6
    - run: swift ${{ matrix.x.action }}
